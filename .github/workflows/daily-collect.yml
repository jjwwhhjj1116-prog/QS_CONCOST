name: CONCOST weekday data collection

on:
  schedule:
    # Separate expressions preserve the intended source group even when GitHub
    # starts a scheduled event late. UTC 00:03~00:53 is 09:03~09:53 KST.
    - cron: "3 0 * * 1-5"
    - cron: "13 0 * * 1-5"
    - cron: "23 0 * * 1-5"
    - cron: "33 0 * * 1-5"
    - cron: "43 0 * * 1-5"
    - cron: "53 0 * * 1-5"
  workflow_dispatch:
    inputs:
      scopes:
        description: "Comma-separated collection scopes for a manual run"
        required: false
        default: "g2b"

concurrency:
  group: concost-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out external collectors
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trigger one bounded collection sweep
        env:
          DIGEST_TRIGGER_TOKEN: ${{ secrets.DIGEST_TRIGGER_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
          SCHEDULE_SPEC: ${{ github.event.schedule }}
          MANUAL_SCOPES: ${{ inputs.scopes }}
          TZ: Asia/Seoul
        run: |
          test -n "$DIGEST_TRIGGER_TOKEN"
          trigger_render() {
            local scopes="$1"
            local response="/tmp/collect-${scopes//,/\-}.json"
            echo "Render collection scopes: $scopes"
            http_code=$(curl --silent --show-error --max-time 150 \
              --output "$response" --write-out "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $DIGEST_TRIGGER_TOKEN" \
              -H "X-Collect-Scheduled: $SCHEDULED_RUN" \
              -H "X-Collect-Wait: true" \
              -H "X-Collect-Scopes: $scopes" \
              https://qs-concost.onrender.com/api/automation/collect)
            cat "$response"
            if [ "$http_code" != "200" ]; then
              echo "Collection did not finish successfully: HTTP $http_code"
              return 1
            fi
            python - "$response" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          job = payload.get("job") or {}
          if not payload.get("ok") or job.get("status") != "complete":
              raise SystemExit("Collection response was not a completed success")
          print("Saved rows:", job.get("inserted", 0), "updated:", job.get("updated", 0),
                "unchanged:", job.get("unchanged", 0))
          PY
          }

          external_g2b=false
          external_jiwoncok=false
          if [ "$SCHEDULED_RUN" = "true" ]; then
            case "$SCHEDULE_SPEC" in
              "3 0 * * 1-5")  external_g2b=true ;;
              "13 0 * * 1-5") trigger_render "content" ;;
              "23 0 * * 1-5") trigger_render "pipeline" ;;
              "33 0 * * 1-5") trigger_render "cost" ;;
              "43 0 * * 1-5") trigger_render "lh,expressway,kwater,kapt" ;;
              "53 0 * * 1-5") external_g2b=true; external_jiwoncok=true ;;
              *) external_g2b=true ;;
            esac
          else
            collect_scopes="${MANUAL_SCOPES:-g2b}"
            web_scopes=""
            IFS=',' read -ra parts <<< "$collect_scopes"
            for scope in "${parts[@]}"; do
              if [ "$scope" = "g2b" ] || [ "$scope" = "nuri" ]; then
                external_g2b=true
              elif [ "$scope" = "jiwoncok" ]; then
                external_jiwoncok=true
              elif [ -n "$scope" ]; then
                web_scopes="${web_scopes:+$web_scopes,}$scope"
              fi
            done
            if [ -n "$web_scopes" ]; then
              trigger_render "$web_scopes"
            fi
          fi

          if [ "$external_g2b" = "true" ]; then
            test -n "$DATA_GO_KR_SERVICE_KEY"
            echo "G2B and Nuri collection run on the GitHub worker."
            g2b_ok=false
            for attempt in 1 2 3; do
              if python -m tender_radar.g2b_worker; then
                g2b_ok=true
                break
              fi
              echo "Public bid API attempt $attempt failed; retrying after a short delay."
              sleep $((attempt * 10))
            done
            test "$g2b_ok" = "true"
          fi

          if [ "$external_jiwoncok" = "true" ]; then
            echo "JiwonCOK collection runs on the GitHub worker."
            python -m tender_radar.jiwoncok_worker
          fi


